name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Lint
        run: uv run --with nox -m nox -s lint
      - name: Format check
        run: uv run --with nox -m nox -s format
      - name: Typing check
        run: uv run --with nox -m nox -s types
      - name: Check versions match
        run: uv run --with nox -m nox -s check_version

  tests:
    name: Run tests
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Tests
        run: uv run --with nox -m nox -s tests

  tests-prerelease:
    name: Run tests on the upcoming Python
    runs-on: ubuntu-latest
    # A pre-release can break on its own, so it does not block a merge
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Tests
        run: uv run --with nox -m nox -s tests_prerelease
